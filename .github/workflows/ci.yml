name: CI Pipeline - Tests, DevSecOps & Docker Hub Release

on:
  push:
    branches: [ main ]

jobs:
  tests-and-quality:
    name: Tests, Sonar & Quality
    runs-on: ubuntu-latest

    steps:
      - name: Cloner le projet
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Installer Java 17
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Lancer les tests unitaires
        run: mvn clean verify
      
      - name: Analyser la qualité du code avec Sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=osza99-organisation \
            -Dsonar.projectKey=OsZa99_devsecops-pipeline-spring-docker \
            -Dsonar.token=$SONAR_TOKEN

      - name: Sauvegarder les rapports de tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-tests-surefire
          path: target/surefire-reports/

  build-and-test:
    name: Docker Build, Security Scan & Push
    runs-on: ubuntu-latest
    needs: tests-and-quality

    steps:
      - name: Cloner le projet
        uses: actions/checkout@v7

      - name: Se connecter à Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire l'image Docker (avec 2 tags)
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }} .

      - name: Scanner l'image avec Trivy 
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:latest 
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Publier les images sur Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }}

  deploy-to-aws:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Cloner le projet
        uses: actions/checkout@v7

      - name: Générer le fichier .env
        run: |
          echo "DB_NAME=${{ secrets.DB_NAME }}" > .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env

      - name: Copier les fichiers sur le serveur AWS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          source: "docker-compose.yaml,nginx.conf,database/,.env"
          target: "/home/ubuntu/devops-app"

      - name: Lancer l'application sur le serveur AWS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          script: |
            cd /home/ubuntu/devops-app
            chmod 600 .env
            docker compose pull            
            docker compose up -d --remove-orphans




