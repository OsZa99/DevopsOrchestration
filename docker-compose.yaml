services:
  spring-app-v1:
    image: osza/devops-app:latest
    container_name: spring-app-v1
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/${DB_NAME}?serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_VERSION: v1
      APP_USER: Ossama
    depends_on:
      - mysql-db
    networks:
      - app-network

  spring-app-v2:
    image: osza/devops-app:latest
    container_name: spring-app-v2
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/${DB_NAME}?serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_VERSION: v2
      APP_USER: Zarani
    depends_on:
      - mysql-db
    networks:
      - app-network

  nginx:
    image: nginx:1.30-alpine
    container_name: nginx-reverse-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - spring-app-v1
      - spring-app-v2
    networks:
      - app-network

  mysql-db:
    image: mysql:5.7
    container_name: mysql-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/monannuaire_mysql.sql:/docker-entrypoint-initdb.d/monannuaire_mysql.sql
    networks:
      - app-network

  backup:
    image: mysql:5.7
    container_name: mysql-backup
    volumes:
      - ./backups:/backups
    entrypoint: >
      /bin/sh -c "sleep 20; while true; do
      mysqldump -h mysql-db -u ${DB_USER} -p${DB_PASSWORD} ${DB_NAME} > /backups/dump-$(date +%F-%H-%M).sql;
      sleep 43200;
      done"
    depends_on:
      - mysql-db
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql-db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - mysql-db
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network: